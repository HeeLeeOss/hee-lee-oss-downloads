description = "Start an Hee-Lee Oss good-deed session: pick a task, do it in this session, open a PR."

prompt = """
Help me complete a community-approved Hee-Lee Oss good deed in THIS interactive Gemini CLI
session, on my own account. Follow the work rules and refusal guardrails in this extension's
GEMINI.md context exactly.

Arguments (optional): {{args}}
- If a task file path was given above, use it directly with `--task-file <path>`.
- Otherwise help me pick one.

Steps:

0. Billing & safety pre-flight (every time):
   - Refuse to proceed if `GEMINI_API_KEY` or `GOOGLE_API_KEY` is set in the environment — that
     would bill the metered API instead of my own account. Tell me to unset it and restart.
   - Confirm the CLI is installed and healthy: run `hee-lee-oss doctor`. If git/gh aren't ready,
     help fix that first.

1. Pick a task:
   - Run `hee-lee-oss browse` to show approved projects.
   - Ask me which project/task, unless a task file path was already given in the arguments.

2. Prepare the workspace:
   - Preview first: `hee-lee-oss pull --task-file <path> --dry-run`.
   - Then prepare it for real: `hee-lee-oss pull --task-file <path>`.
   - This creates a workspace under `~/Hee-Lee Oss/queue/<task-id>/` with `TASK.md`, `CONTEXT.md`,
     and a claim file. If a claim already exists, resume it — do not duplicate work.

3. Do the work (this is the deed):
   - Move into the workspace. Read `TASK.md` and `CONTEXT.md` fully.
   - Honor the refusal guardrails in `CONTEXT.md` and in this extension's GEMINI.md. If the task
     would cause harm, mislead, give unqualified high-stakes advice without the required review,
     or primarily benefit a for-profit — stop and tell me instead of proceeding.
   - Produce the deliverable at the task's output destination. Meet every acceptance criterion.

4. Submit:
   - Run: `hee-lee-oss submit <task-id> --repo <project-owner>/<project-repo> --agent gemini-cli`
   - This commits, pushes from my fork, opens the PR, and writes a deed receipt.
   - Share the PR URL with me.

5. Loop or stop:
   - Ask if I want another task. If yes, use `/hee-lee-oss:next`.
   - Respect the budget guard — if `hee-lee-oss pull` reports the session cap is reached, stop
     gracefully.

Keep me informed at each step. Never run headless; never set an API key.

6. If the task lands in a repository Hee-Lee Oss does not own (`hee-lee-oss pull` prints its
   contribution terms and base branch):
   - Read their CONTRIBUTING and PR template first; follow **their** conventions, not ours.
   - Their licence governs. Never add Hee-Lee Oss branding, badges, or licence headers upstream.
   - Smallest diff that satisfies the task. Run their tests; never disable one to get green.
   - The PR discloses AI assistance and links the upstream issue — leave that in.
   - Never write their issue as `owner/repo#number` in a commit message; GitHub auto-links it into
     their tracker. Use the URL or prose. A bare `#123` inside a PR against their repo is fine.
   - `hee-lee-oss complete` / `reopen` do not apply upstream; merged or closed there is the state.
   - If the task is wrong for that repo, stop and say so. Not opening a PR is a good outcome.

"""
